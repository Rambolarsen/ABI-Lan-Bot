name: .NET build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore ABILanBot.sln
      - name: Build
        run: dotnet build ABILanBot.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test ABILanBot.sln --configuration Release --no-build
